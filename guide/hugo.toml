baseURL = "https://platform-engineering.cd.foundation/"
title = "CI/CD Platform Engineering Golden Path Guide | CD Foundation"

enableRobotsTXT = true
enableGitInfo = true

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
tag = "tags"
category = "categories"

[params.taxonomy]
taxonomyCloud = ["tags", "categories"]
taxonomyCloudTitle = ["Tag Cloud", "Categories"]
taxonomyPageHeader = ["tags", "categories"]

# SEO Configuration
[params.seo]
title_separator = " | "
description = "Building Better Developer Experiences with Open-Source Golden Paths."
keywords = [
  "Platform Engineering",
  "Golden Paths",
  "Internal Developer Platforms",
  "IDP",
  "CI/CD",
  "Software Delivery Automation",
  "Observability",
  "AI-Assisted Development",
  "Continuous Delivery Foundation",
  "CDF Platform Engineering SIG"
]
author = "CD Foundation Platform Engineering SIG"
image = "/images/platformengineeringLogo.png"
twitter_card = "summary_large_image"
twitter_site = "@CDeliveryFdn"

# Syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

# Image processing
[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

# Analytics
[services]
  [services.googleAnalytics]
  # id = "G-XXXXXXXXXX"

# Language configuration
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    [languages.en.params]
      title = "CI/CD Platform Engineering Golden Paths | CD Foundation"
      description = "Building Better Developer Experiences with Open-Source Golden Paths."
      time_format_default = "2026.03.14"
      time_format_blog = "2026.03.14"
  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    weight = 2
    [languages.es.params]
      title = "Guía de ciberseguridad para CI/CD | Fundación CD"
      description = "Incorpora la ciberseguridad en tus pipelines de CI/CD con salvaguardas estándar de la industria. Aprende las mejores prácticas de DevSecOps, herramientas de seguridad y marcos para el ciclo de vida del desarrollo de software seguro."
      time_format_default = "03.14.2026"
      time_format_blog = "03.14.2026"

# Docsy theme
[module]
proxy = "direct"

  [module.hugoVersion]
  extended = true
  min = "0.99.0"

  [[module.imports]]
  path = "github.com/google/docsy"

  [[module.imports]]
  path = "github.com/google/docsy/dependencies"

# 🔑 GOLDMARK CONFIG — THIS FIXES THE <pre> ISSUE
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = "tango"

# Output formats
[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "print", "RSS"]

# Site Params
[params]
copyright = "CD Foundation | Apache-2.0 license"
images = ["https://cd.foundation/wp-content/uploads/sites/78/2023/07/CDF-Home-Social-1024x536.png"]
version_menu = "Releases"
archived_version = false
version = "0.0"
url_latest_version = "https://platform-engineering.cd.foundation"

github_repo = "https://github.com/cdfoundation/Platform-Engineering/tree/main/guide"
github_branch = "main"

# Search
offlineSearch = true
offlineSearchMaxResults = 20
offlineSearchSummaryLength = 200

prism_syntax_highlighting = false

# UI
[params.ui]
breadcrumb_disable = false
footer_about_enable = true
navbar_logo = true
navbar_translucent_over_cover_disable = true
# Docsy v0.13 dark-mode switch; see: https://github.com/google/docsy/blob/v0.13.0/layouts/_partials/navbar.html
showLightDarkModeMenu = true
sidebar_search_disable = false
# CORRECTED SIDEBAR SETTINGS:
sidebar_menu_compact = true
sidebar_menu_foldable = true

[params.ui.feedback]
enable = false

[params.ui.readingtime]
enable = false

[params.links]
  [[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/cdfoundation/Platform-Engineering/tree/main/guide"
  icon = "fab fa-github"
  desc = "Development takes place here!"
